<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expiration Date Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #333;
            text-align: center;
        }
        h2 {
            color: #555;
            font-size: 1.2em;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-top: 20px;
        }
        .current-date {
            text-align: center;
            font-size: 1.2em;
            margin-bottom: 20px;
            color: #4a4a4a;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f2f2f2;
        }
        
        /* Tab Navigation Styles */
        .tab-nav {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 5px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px 5px;
            background-color: #e0e0e0;
            color: #555;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.95em;
            transition: background-color 0.3s, color 0.3s;
        }
        .tab-btn:hover {
            background-color: #d0d0d0;
        }
        .tab-btn.active {
            background-color: #4CAF50;
            color: white;
            font-weight: bold;
        }

        /* Calculator Styles */
        .calculator-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 1em;
        }
        .calc-btn {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 5px;
        }
        .calc-btn:hover {
            background-color: #45a049;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8f5e9;
            border: 1px solid #4CAF50;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
            color: #2e7d32;
            font-size: 1.1em;
        }
        .result-error {
            background-color: #ffebee;
            border-color: #ef5350;
            color: #c62828;
        }

        .hidden {
            display: none;
        }
        th.sortable {
            cursor: pointer;
        }
        th.sortable::after {
            content: " ↕";
            font-size: 0.8em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Expiration Date Calculator</h1>
        <div id="currentDate" class="current-date"></div>

        <!-- Tab Navigation -->
        <div class="tab-nav">
            <button id="tabRegular" class="tab-btn active" onclick="setView('regular')">Regular</button>
            <button id="tabJulian" class="tab-btn" onclick="setView('julian')">Julian</button>
            <button id="tabInventory" class="tab-btn" onclick="setView('inventory')">Inventory</button>
        </div>

        <!-- View 1: Regular Dates -->
        <div id="regularView">
            <table id="expirationTableRegular">
                <tr>
                    <th>Category</th>
                    <th>Expiration Date</th>
                </tr>
            </table>
        </div>

        <!-- View 2: Julian Dates + Calculator -->
        <div id="julianView" class="hidden">
            <table id="expirationTableJulian">
                <tr>
                    <th>Category</th>
                    <th>Expiration Date</th>
                </tr>
            </table>
            
            <!-- Calculator integrated here -->
            <div class="calculator-section">
                <h2>Julian Date Calculator</h2>
                <div class="input-group">
                    <label for="julianInput">Manufacture Date (Julian):</label>
                    <input type="tel" id="julianInput" placeholder="e.g., 4125 (Year 4, Day 125)" inputmode="numeric">
                </div>
                <div class="input-group">
                    <label for="shelfLifeInput">Shelf Life (Days):</label>
                    <input type="number" id="shelfLifeInput" placeholder="e.g., 105" inputmode="numeric">
                </div>
                <button class="calc-btn" onclick="calculateCustomExpiration()">Calculate Expiration</button>
                <div id="calcResult" class="result-box hidden"></div>
            </div>
        </div>

        <!-- View 3: Inventory -->
        <div id="inventoryView" class="hidden">
            <table id="referenceTable">
                <tr>
                    <th class="sortable" onclick="sortTable(0)">Food Item</th>
                    <th class="sortable" onclick="sortTable(1)">Days</th>
                </tr>
            </table>
        </div>
    </div>

    <script>
        let currentView = 'regular';

        const referenceData = [
            { item: "Jimmy Dean Breakfast Sandwich", days: 7 },
            { item: "PB&J Sandwich", days: 7 },
            { item: "Tyson Chicken Sandwich", days: 7 },
            { item: "Hot Dog Buns", days: 7 },
            { item: "Don Miguel Burrito", days: 10 },
            { item: "Pierre Grilled Cheese Melt", days: 14 },
            { item: "Big AZ Burger", days: 14 },
            { item: "Big AZ Sandwich", days: 14 },
            { item: "BBQ Pulled Pork Sandwich", days: 14 },
            { item: "Pierre Philly Cheese Melt", days: 14 },
            { item: "Tyson Waffle Chicken Sandwich", days: 14 },
            { item: "Petite Cheesecake", days: 21 },
            { item: "Prairie City Cookie", days: 21 },
            { item: "Bomb Burrito", days: 21 },
            { item: "Nemo Cake", days: 30 }
        ];

        function formatDate(date) {
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            return `${month}/${day}/${year}`;
        }

        function getJulianDate(date) {
            const start = new Date(date.getFullYear(), 0, 0);
            const diff = date - start;
            const oneDay = 1000 * 60 * 60 * 24;
            const dayOfYear = Math.floor(diff / oneDay);
            return String(date.getFullYear()).slice(-1) + String(dayOfYear).padStart(3, '0');
        }

        function parseJulianDate(julianString) {
            if (!julianString || julianString.length < 4) return null;
            const yearDigit = parseInt(julianString.substring(0, 1));
            const dayOfYear = parseInt(julianString.substring(1));
            if (isNaN(yearDigit) || isNaN(dayOfYear)) return null;
            
            const currentYear = new Date().getFullYear();
            const currentDecade = Math.floor(currentYear / 10) * 10;
            let year = currentDecade + yearDigit;
            
            return new Date(year, 0, dayOfYear);
        }

        function setView(viewType) {
            currentView = viewType;
            
            document.getElementById("regularView").classList.add("hidden");
            document.getElementById("julianView").classList.add("hidden");
            document.getElementById("inventoryView").classList.add("hidden");

            document.getElementById("tabRegular").classList.remove("active");
            document.getElementById("tabJulian").classList.remove("active");
            document.getElementById("tabInventory").classList.remove("active");

            // FIX 1: Always update date display to match current view
            const currentDate = new Date();
            
            if (viewType === 'regular') {
                document.getElementById("regularView").classList.remove("hidden");
                document.getElementById("tabRegular").classList.add("active");
                populateExpirationTable('regular');
            } else if (viewType === 'julian') {
                document.getElementById("julianView").classList.remove("hidden");
                document.getElementById("tabJulian").classList.add("active");
                populateExpirationTable('julian');
            } else if (viewType === 'inventory') {
                document.getElementById("inventoryView").classList.remove("hidden");
                document.getElementById("tabInventory").classList.add("active");
                // Update date to regular format when on inventory view
                updateCurrentDateDisplay(currentDate, 'regular');
                populateReferenceTable();
            }
        }

        function populateExpirationTable(type) {
            const categories = [
                { days: 7, label: "7 days" },
                { days: 10, label: "10 days" },
                { days: 14, label: "14 days" },
                { days: 21, label: "21 days" },
                { days: 30, label: "30 days" }
            ];

            const currentDate = new Date();
            updateCurrentDateDisplay(currentDate, type);

            const tableId = type === 'julian' ? "expirationTableJulian" : "expirationTableRegular";
            const table = document.getElementById(tableId);

            while (table.rows.length > 1) {
                table.deleteRow(1);
            }

            categories.forEach(category => {
                const row = table.insertRow(-1);
                const categoryCell = row.insertCell(0);
                const dateCell = row.insertCell(1);

                categoryCell.textContent = category.label;
                const expirationDate = new Date(currentDate.getTime() + (category.days * 24 * 60 * 60 * 1000));
                
                dateCell.textContent = type === 'julian' ? getJulianDate(expirationDate) : formatDate(expirationDate);
            });
        }

        function updateCurrentDateDisplay(date, type) {
            const currentDateElement = document.getElementById("currentDate");
            const formattedDate = type === 'julian' ? getJulianDate(date) : formatDate(date);
            currentDateElement.textContent = `Today's Date: ${formattedDate}`;
        }

        function populateReferenceTable() {
            const table = document.getElementById("referenceTable");
            while (table.rows.length > 1) {
                table.deleteRow(1);
            }

            referenceData.forEach(item => {
                const row = table.insertRow(-1);
                const itemCell = row.insertCell(0);
                const daysCell = row.insertCell(1);
                itemCell.textContent = item.item;
                daysCell.textContent = item.days;
            });
        }

        function calculateCustomExpiration() {
            const julianInput = document.getElementById('julianInput').value.trim();
            const shelfLifeInput = document.getElementById('shelfLifeInput').value;
            const resultDiv = document.getElementById('calcResult');

            if (!julianInput || !shelfLifeInput) {
                resultDiv.innerHTML = "Please enter both a Julian date and shelf life.";
                resultDiv.classList.add('result-error');
                resultDiv.classList.remove('hidden');
                return;
            }

            const startDate = parseJulianDate(julianInput);
            const shelfDays = parseInt(shelfLifeInput);

            if (!startDate) {
                resultDiv.innerHTML = "Invalid Julian Format. Use YDDD (e.g., 4125).";
                resultDiv.classList.add('result-error');
                resultDiv.classList.remove('hidden');
                return;
            }

            const expirationDate = new Date(startDate.getTime() + (shelfDays * 24 * 60 * 60 * 1000));

            resultDiv.innerHTML = `
                <strong>Result:</strong><br>
                Manufactured: ${formatDate(startDate)}<br>
                Expires: ${formatDate(expirationDate)}
            `;
            resultDiv.classList.remove('result-error', 'hidden');
        }

        function sortTable(column) {
            const table = document.getElementById("referenceTable");
            const rows = Array.from(table.rows).slice(1);
            const isAscending = table.rows[0].cells[column].classList.toggle("asc");

            rows.sort((a, b) => {
                const aValue = a.cells[column].textContent;
                const bValue = b.cells[column].textContent;
                if (column === 1) {
                    return isAscending ? aValue - bValue : bValue - aValue;
                } else {
                    return isAscending ? aValue.localeCompare(bValue) : bValue.localeCompare(aValue);
                }
            });

            rows.forEach(row => table.appendChild(row));
        }

        setView('regular');
    </script>
</body>
</html>
